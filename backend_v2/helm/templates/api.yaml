apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels: {app: {{ .Release.Name }}-api}
spec:
  replicas: {{ .Values.replicas.api }}
  selector:
    matchLabels: {app: {{ .Release.Name }}-api}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}-api}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: {{ include "bda.backendImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uvicorn", "backend_v2.app.main:app", "--host", "0.0.0.0", "--port", "8200"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: ["ALL"]}
          envFrom:
            - configMapRef: {name: {{ .Release.Name }}-config}
            - secretRef: {name: {{ .Values.existingSecret }}}
          ports: [{name: http, containerPort: 8200}]
          readinessProbe: {httpGet: {path: /api/v2/health/ready, port: http}, initialDelaySeconds: 5}
          livenessProbe: {httpGet: {path: /api/v2/health/live, port: http}, initialDelaySeconds: 10}
          resources: {{- toYaml .Values.resources.api | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- include "bda.byokVolumeMount" . | nindent 12 }}
      volumes:
        - {name: tmp, emptyDir: {}}
        {{- include "bda.byokVolume" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
spec:
  selector: {app: {{ .Release.Name }}-api}
  ports: [{name: http, port: {{ .Values.service.port }}, targetPort: http}]
