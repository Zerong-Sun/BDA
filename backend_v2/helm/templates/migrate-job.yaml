apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate-{{ .Release.Revision }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels: {app: {{ .Release.Name }}-migrate}
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["alembic", "-c", "backend_v2/alembic.ini", "upgrade", "head"]
          env:
            - {name: BDA_V2_ENVIRONMENT, value: {{ .Values.config.environment | quote }}}
            - {name: BDA_V2_COMPUTE_BACKEND, value: {{ .Values.config.computeBackend | quote }}}
          envFrom:
            - secretRef: {name: {{ .Values.existingSecret }}}
