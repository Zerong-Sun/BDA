[project]
name = "bda-backend-v2"
version = "2.0.0"
description = "BDA Workbench v2 API and worker"
requires-python = ">=3.13"
readme = "README.md"
dependencies = [
  "alembic==1.18.5",
  "celery[redis]==5.6.3",
  "docker==7.2.0",
  "fastapi==0.139.0",
  "greenlet==3.5.5",
  "httpx==0.28.1",
  "jsonschema==4.25.1",
  "minio==7.2.20",
  "numpy==2.5.2",
  "openpyxl==3.1.5",
  "paramiko==5.0.0",
  "opentelemetry-api==1.43.0",
  "opentelemetry-exporter-otlp-proto-http==1.43.0",
  "opentelemetry-sdk==1.43.0",
  "bcrypt==5.0.0",
  "biopython==1.87",
  "prometheus-client==0.25.0",
  "psycopg[binary]==3.2.10",
  "scipy==1.16.2",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "PyJWT==2.13.0",
  "python-multipart==0.0.32",
  "sse-starlette==3.4.5",
  "sqlalchemy==2.0.51",
  "structlog==24.4.0",
  "uvicorn[standard]==0.49.0",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.7.0",
  "mypy==1.17.1",
  "pytest==9.1.1",
  "types-paramiko==5.0.0.20260724",
  "types-jsonschema==4.26.0.20260518",
  "types-docker==7.2.0.20260827",
  "pytest-cov==7.1.0",
  "ruff==0.15.21",
]

[tool.setuptools]
packages = []

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
addopts = "-q"

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true

# Celery ships no py.typed marker. The imports carry inline ignores instead of an
# override here, so that `mypy` behaves identically whether or not this config is
# loaded - CI invokes it without --config-file, the README documents it with.
