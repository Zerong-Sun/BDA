services:
  api-v2:
    volumes:
      - ./backend_v2:/app/backend_v2
    command: >-
      sh -c "alembic -c backend_v2/alembic.ini upgrade head &&
      uvicorn backend_v2.app.main:app --host 0.0.0.0 --port 8200 --reload"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      BDA_V2_PROXY_TARGET: http://api-v2:8200
    ports:
      - "5173:8080"
    expose:
      - "8080"
    command: npm run dev -- --host 0.0.0.0 --port 8080
