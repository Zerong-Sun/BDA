services:
  postgres-v2:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bda_v2
      POSTGRES_USER: bda
      POSTGRES_PASSWORD: ${BDA_V2_POSTGRES_PASSWORD:?BDA_V2_POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_v2_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bda -d bda_v2"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-v2:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${BDA_V2_REDIS_PASSWORD:?BDA_V2_REDIS_PASSWORD must be set}"]
    environment:
      REDIS_PASSWORD: ${BDA_V2_REDIS_PASSWORD:?BDA_V2_REDIS_PASSWORD must be set}
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-v2:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${BDA_V2_MINIO_ACCESS_KEY:?BDA_V2_MINIO_ACCESS_KEY must be set}
      MINIO_ROOT_PASSWORD: ${BDA_V2_MINIO_SECRET_KEY:?BDA_V2_MINIO_SECRET_KEY must be set}
    volumes:
      - minio_v2_data:/data
    ports:
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9003:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-v2:
    image: bda-api-v2:local
    build:
      context: .
      dockerfile: backend_v2/Dockerfile
    env_file: .env
    environment: &v2_environment
      BDA_V2_DATABASE_URL: postgresql+psycopg://bda:${BDA_V2_POSTGRES_PASSWORD}@postgres-v2:5432/bda_v2
      BDA_V2_REDIS_URL: redis://:${BDA_V2_REDIS_PASSWORD}@redis-v2:6379/0
      BDA_V2_CELERY_BROKER_URL: redis://:${BDA_V2_REDIS_PASSWORD}@redis-v2:6379/1
      BDA_V2_MINIO_ENDPOINT: minio-v2:9000
      BDA_V2_MINIO_PUBLIC_ENDPOINT: ${BDA_V2_MINIO_PUBLIC_ENDPOINT:-localhost:9002}
      BDA_V2_MINIO_ACCESS_KEY: ${BDA_V2_MINIO_ACCESS_KEY:?BDA_V2_MINIO_ACCESS_KEY must be set}
      BDA_V2_MINIO_SECRET_KEY: ${BDA_V2_MINIO_SECRET_KEY:?BDA_V2_MINIO_SECRET_KEY must be set}
      BDA_V2_LLM_LOCAL_SECRET_DIR: /var/lib/bda/secrets
    command: >-
      sh -c "alembic -c backend_v2/alembic.ini upgrade head &&
      uvicorn backend_v2.app.main:app --host 0.0.0.0 --port 8200"
    ports:
      - "127.0.0.1:8200:8200"
    volumes:
      - byok-secrets:/var/lib/bda/secrets
    depends_on:
      postgres-v2:
        condition: service_healthy
      redis-v2:
        condition: service_healthy
      minio-v2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8200/api/v2/health/ready')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  worker-v2:
    image: bda-api-v2:local
    env_file: .env
    environment: *v2_environment
    command: celery -A backend_v2.app.compute.tasks.celery_app worker -Q dispatch,poll,collect,maintenance --loglevel=info
    depends_on:
      api-v2:
        condition: service_healthy

  research-worker-v2:
    image: bda-api-v2:local
    env_file: .env
    environment: *v2_environment
    command: celery -A backend_v2.app.compute.tasks.celery_app worker -Q research --loglevel=info
    depends_on:
      api-v2:
        condition: service_healthy

  copilot-worker-v2:
    image: bda-api-v2:local
    env_file: .env
    environment: *v2_environment
    command: celery -A backend_v2.app.compute.tasks.celery_app worker -Q copilot --loglevel=info
    volumes:
      - byok-secrets:/var/lib/bda/secrets:ro
    depends_on:
      api-v2:
        condition: service_healthy

  beat-v2:
    image: bda-api-v2:local
    env_file: .env
    environment: *v2_environment
    command: celery -A backend_v2.app.compute.tasks.celery_app beat --loglevel=info
    depends_on:
      api-v2:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE: /api/v2
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      api-v2:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  byok-secrets:
  postgres_v2_data:
  minio_v2_data:
