server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Content-hashed build output. A missing file here means the client is holding a
    # stale index.html and asking for a chunk that no longer exists; falling through to
    # the SPA route would answer with index.html, and the browser then reports a MIME
    # type error instead of a 404 - which reads as a broken deployment rather than as
    # "reload the tab". 404 says the true thing.
    location /assets/ {
        try_files $uri =404;
        # Safe to cache hard: the filename changes whenever the content does.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # index.html itself must never be cached, or a client keeps resolving the old asset
    # names for as long as its cache lives - which is the situation above.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
