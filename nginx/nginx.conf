# Reverse proxy for the BDA Workbench edge.
#
# TLS: terminate HTTPS here in production. Mount certs and enable the 443 server
# block below (a self-signed pair works for staging). The HTTP block then becomes
# a redirect to HTTPS. Certificates are intentionally not committed to the repo.
#
# server {
#     listen 443 ssl http2;
#     server_name bda.local;
#     ssl_certificate     /etc/nginx/certs/fullchain.pem;
#     ssl_certificate_key /etc/nginx/certs/privkey.pem;
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_ciphers HIGH:!aNULL:!MD5;
#     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#     # ... same location blocks as below ...
# }

resolver 127.0.0.11 valid=10s ipv6=off;

upstream api_v2_backend {
    zone api_v2_backend 64k;
    server api-v2:8200 resolve;
    keepalive 64;
}

server {
    listen 80;
    server_name bda.local localhost;

    # Baseline security headers applied to every response.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-XSS-Protection "0" always;
    # Staging observation policy. Promote to Content-Security-Policy only after
    # Mol*, signed MinIO URLs, Web Workers and blob URLs have been exercised.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Don't leak the nginx version.
    server_tokens off;

    location / {
        proxy_pass http://frontend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v2/ {
        proxy_pass http://api_v2_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header traceparent $http_traceparent;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 300s;
        proxy_buffering off;
        client_max_body_size 1m;
    }
}
